name: osszharang_app
description: "com.ballakeve.osszharang"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+8

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  alarm: ^3.0.8
  flutter_slidable: ^3.0.1
  permission_handler: ^11.2.1
  simple_ripple_animation: ^0.0.9
  intl: ^0.19.0
  flutter_sound: ^9.28.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  image_path: "icons/harang.jpg"
  android: true
  ios: true



flutter:
  assets:
    - assets/harangborito.jpg
    - assets/harang.jpg
    - assets/hatter.jpg
    - assets/harangozas2.mp3
    - assets/harangozas.jpg
    - assets/trianon.gif
    - assets/harangozas.gif
    - assets/harangborito.png
    - assets/hatter.png


  uses-material-design: true

